# Docker Compose 配置文件
# 闲鱼自动回复系统 - 本地源码构建
# 用法: docker compose up -d --build

# 全局日志轮转（2026-09-29 事故修复：scheduler 日志涨到 6.2G 把根分区写满，
# 导致 mysql/backend-web/websocket/scheduler 相继 exit 137，全站不可用）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ====== 基础设施 ======

  # MySQL数据库（默认使用官方镜像，可通过 MYSQL_IMAGE 覆盖为任意镜像源）
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: xianyu-mysql
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "13306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-xianyu@2026}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-xianyu_data}
      - MYSQL_USER=${MYSQL_USER:-xianyu}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-xianyu@2026}
      - TZ=Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=300
      - --max-allowed-packet=256M
      - --default-time-zone=+08:00
      # binlog 保留 3 天（2026-09-29 修复：原先 30 天，单个 binlog 涨到 305M，
      # 叠加容器日志无轮转导致磁盘写满、全站不可用）
      - --binlog_expire_logs_seconds=259200
      # 单个 binlog 超过 100M 就滚动，避免单文件过大
      - --max_binlog_size=100M
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-xianyu@2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis缓存（默认使用官方镜像，可通过 REDIS_IMAGE 覆盖为任意镜像源）
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: xianyu-redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-xianyu@2026}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-xianyu@2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ====== 应用服务 ======

  # Backend-Web 服务
  backend-web:
    build:
      context: .
      dockerfile: backend-web/Dockerfile
    container_name: xianyu-backend-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      - ENVIRONMENT=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-xianyu}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-xianyu@2026}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-xianyu_data}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-xianyu@2026}
      - REDIS_DB=${REDIS_DB:-0}
      - BACKEND_WEB_PORT=8089
      - HOST=0.0.0.0
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REFRESH_TOKEN_EXPIRE_MINUTES=${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      - CORS_ORIGINS=*
      - WEBSOCKET_SERVICE_URL=http://websocket:8090
      - SCHEDULER_SERVICE_URL=http://scheduler:8091
      - STATIC_DIR=/app/static
      - BACKUP_DIR=/app/backups
      - BACKEND_WEB_PUBLIC_URL=${BACKEND_WEB_PUBLIC_URL:-}
      - CARD_DOCK_BASE_URL=${CARD_DOCK_BASE_URL:-}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY:-}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-}
      - AUTO_START_CRAWL_JOBS=${AUTO_START_CRAWL_JOBS:-true}
      - BROWSER_HEADLESS=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # 售罄自动重发（普通账号用重发次数模拟库存）
      - STOCK_REPOST_ENABLED=${STOCK_REPOST_ENABLED:-false}
      - STOCK_REPOST_INTERVAL_SECONDS=${STOCK_REPOST_INTERVAL_SECONDS:-1800}
      - STOCK_REPOST_MAX_PER_RUN=${STOCK_REPOST_MAX_PER_RUN:-2}
      - SQL_ECHO=${SQL_ECHO:-true}
      - TOKEN_CACHE_TTL_MIN_HOURS=${TOKEN_CACHE_TTL_MIN_HOURS:-5}
      - TOKEN_CACHE_TTL_MAX_HOURS=${TOKEN_CACHE_TTL_MAX_HOURS:-10}
      - TZ=Asia/Shanghai
    volumes:
      - backend_web_logs:/app/backend-web/logs
      - static-files:/app/static
      - backup-files:/app/backups
      # 库存补丁：仓库文件为准，挂进容器免重建（磁盘 85%，重建要重装 playwright/chromium，风险太大）
      - ./common/services/xianyu_mtop.py:/app/common/services/xianyu_mtop.py:ro
      - ./common/services/item_offline_service.py:/app/common/services/item_offline_service.py:ro
      - ./common/services/seller_item_service.py:/app/common/services/seller_item_service.py:ro
      - ./common/services/item_stock_service.py:/app/common/services/item_stock_service.py:ro
      - ./common/services/publish_execution_service.py:/app/common/services/publish_execution_service.py:ro
      - ./backend-web/app/services/product_publish_service.py:/app/backend-web/app/services/product_publish_service.py:ro
      - ./backend-web/app/services/publish_execution_service.py:/app/backend-web/app/services/publish_execution_service.py:ro
      - ./backend-web/app/api/routes/product_publish.py:/app/backend-web/app/api/routes/product_publish.py:ro
      - ./common/services/stock_repost_service.py:/app/common/services/stock_repost_service.py:ro
      - ./backend-web/_bootstrap.py:/app/backend-web/_bootstrap.py:ro
      - ./backend-web/app/core/config.py:/app/backend-web/app/core/config.py:ro
      - ./backend-web/app/services/xianyu_publisher.py:/app/backend-web/app/services/xianyu_publisher.py:ro
    ports:
      # 对外暴露端口默认 8778（避免与常用服务 8089 冲突）；容器内部仍为 8089
      - "${BACKEND_WEB_PORT:-8778}:8089"
    networks:
      - xianyu-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # WebSocket 服务
  websocket:
    build:
      context: .
      dockerfile: websocket/Dockerfile
    container_name: xianyu-websocket
    restart: unless-stopped
    logging: *default-logging
    # PID 1 交给 tini：解滑块起的 chromium 孙进程在主进程死后会变孤儿，没有 init 就没人回收
    init: true
    # 我们这个进程直接起的 chromium，tini 管不到（父进程还活着），必须自己 waitpid 回收，
    # 否则每起一次浏览器漏一个僵尸（实测 34 小时攒 10,468 个，把 4 核机拖到负载 91、
    # 内存只剩 111MB，发布页面每一步都超时）。启动真正入口前先挂一个后台回收线程。
    command:
      - python
      - -c
      - |
        import os, threading, time

        def _reap_loop(interval=30):
            while True:
                try:
                    while True:
                        pid, _ = os.waitpid(-1, os.WNOHANG)
                        if pid <= 0:
                            break
                except Exception:
                    pass
                time.sleep(interval)

        threading.Thread(target=_reap_loop, daemon=True, name="child-reaper").start()

        import runpy
        runpy.run_path("/app/websocket/main.py", run_name="__main__")
    environment:
      - ENVIRONMENT=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-xianyu}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-xianyu@2026}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-xianyu_data}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-xianyu@2026}
      - REDIS_DB=${REDIS_DB:-0}
      - WEBSOCKET_PORT=8090
      - HOST=0.0.0.0
      - MAX_CAPTCHA_CONCURRENT=${MAX_CAPTCHA_CONCURRENT:-3}
      - BROWSER_HEADLESS=true
      - AUTO_START_WEBSOCKET=${AUTO_START_WEBSOCKET:-true}
      - CAPTCHA_DRISSIONPAGE_FALLBACK_ENABLED=${CAPTCHA_DRISSIONPAGE_FALLBACK_ENABLED:-true}
      - CAPTCHA_DRISSIONPAGE_TIMEOUT=${CAPTCHA_DRISSIONPAGE_TIMEOUT:-25}
      - CAPTCHA_DRISSIONPAGE_HEADLESS=${CAPTCHA_DRISSIONPAGE_HEADLESS:-true}
      - BACKEND_WEB_SERVICE_URL=http://backend-web:8089
      - STATIC_DIR=/app/static
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SQL_ECHO=${SQL_ECHO:-true}
      - TOKEN_CACHE_TTL_MIN_HOURS=${TOKEN_CACHE_TTL_MIN_HOURS:-5}
      - TOKEN_CACHE_TTL_MAX_HOURS=${TOKEN_CACHE_TTL_MAX_HOURS:-10}
      - TZ=Asia/Shanghai
    volumes:
      - websocket_logs:/app/websocket/logs
      - static-files:/app/static
      - browser_data:/app/browser_data
      # 解滑块退避补丁：仓库文件为准，挂进容器免重建（磁盘 91%，重建风险太大）
      - ./websocket/app/services/xianyu/cookie_token_manager.py:/app/websocket/app/services/xianyu/cookie_token_manager.py:ro
    ports:
      - "${WEBSOCKET_PORT:-8090}:8090"
    networks:
      - xianyu-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Scheduler 服务
  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: xianyu-scheduler
    restart: unless-stopped
    logging: *default-logging
    environment:
      - ENVIRONMENT=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-xianyu}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-xianyu@2026}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-xianyu_data}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-xianyu@2026}
      - REDIS_DB=${REDIS_DB:-0}
      - SCHEDULER_PORT=8091
      - HOST=0.0.0.0
      - REDELIVERY_INTERVAL=${REDELIVERY_INTERVAL:-5}
      - RATE_INTERVAL=${RATE_INTERVAL:-20}
      - WEBSOCKET_SERVICE_URL=http://websocket:8090
      - BACKEND_WEB_SERVICE_URL=http://backend-web:8089
      - STATIC_DIR=/app/static
      - BACKUP_DIR=/app/backups
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SQL_ECHO=${SQL_ECHO:-true}
      - TZ=Asia/Shanghai
    volumes:
      - scheduler_logs:/app/scheduler/logs
      - static-files:/app/static:ro
      - backup-files:/app/backups
    ports:
      - "${SCHEDULER_PORT:-8091}:8091"
    networks:
      - xianyu-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      websocket:
        condition: service_healthy
      backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: xianyu-frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-9000}:80"
    networks:
      - xianyu-network
    depends_on:
      backend-web:
        condition: service_healthy

networks:
  xianyu-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  websocket_logs:
    driver: local
  backend_web_logs:
    driver: local
  scheduler_logs:
    driver: local
  static-files:
    driver: local
  backup-files:
    driver: local
  browser_data:
    driver: local
